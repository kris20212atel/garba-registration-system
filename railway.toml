[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python manage.py migrate --run-syncdb && python manage.py init_setup && python manage.py collectstatic --noinput && gunicorn navratri_project.wsgi --log-file -"
healthcheckPath = "/login/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
