<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Navratri EMS</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪔</text></svg>">
  {% load static %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/navratri.css' %}">
</head>
<body>
<div class="login-wrapper">
  <div class="login-card">
    <div class="login-logo">🪔</div>
    <h1>Navratri EMS</h1>
    <p class="subtitle">Child Gift & Entry Management System<br>Administrator Login</p>

    {% if form.errors %}
    <div class="alert-danger-custom mb-3">
      ❌ Invalid username or password. Please try again.
    </div>
    {% endif %}

    <form method="post" id="loginForm">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label" for="id_username">👤 Username</label>
        <input type="text" name="username" id="id_username"
               class="form-control form-control-lg {% if form.username.errors %}is-invalid{% endif %}"
               placeholder="Enter username" autofocus autocomplete="username" required>
      </div>
      <div class="mb-4">
        <label class="form-label" for="id_password">🔒 Password</label>
        <input type="password" name="password" id="id_password"
               class="form-control form-control-lg {% if form.password.errors %}is-invalid{% endif %}"
               placeholder="Enter password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-xl w-100">
        🔐 Login
      </button>
    </form>

    <p class="text-center mt-3" style="font-size:0.8rem;color:var(--text-muted);">
      Only authorized administrators can access this system.
    </p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
